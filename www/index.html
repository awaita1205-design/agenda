<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    
    <!-- PWA: Manifest y configuración -->
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        /* ... Tu CSS actual se mantiene igual ... */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f5f5f7 70%, #e8e8ed 100%); color: #1d1d1f; padding-top: 130px; padding-bottom: 40px; min-height: 100vh; overflow-x: hidden; }
        .fixed-header { position: fixed; top: 0; left: 0; width: 100%; height: 96px; background-color: rgba(255, 255, 255, 0.75); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .header-title { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; background: linear-gradient(180deg, #1d1d1f 0%, #434345 50%, #86868b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: titleSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes titleSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .main-content { max-width: 460px; margin: 0 auto; padding: 0 20px; }
        .menu-grid { display: flex; flex-direction: column; gap: 18px; opacity: 0; transform: translateY(20px); animation: gridReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
        @keyframes gridReveal { to { opacity: 1; transform: translateY(0); } }
        .menu-card { background: rgba(255, 255, 255, 0.8); border-radius: 24px; padding: 24px; text-decoration: none; color: #1d1d1f; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255,255,255,0.6); border: 1px solid rgba(0, 0, 0, 0.03); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        .menu-card:hover { transform: translateY(-5px) scale(1.02); background: #ffffff; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.08); }
        .menu-card:active { transform: scale(0.97); background-color: rgba(255, 255, 255, 0.5); backdrop-filter: blur(5px); }
        .card-left { display: flex; align-items: center; gap: 18px; text-align: left; }
        .card-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; box-shadow: 0 8px 16px rgba(0,0,0,0.04); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .menu-card:hover .card-icon { transform: scale(1.1) rotate(4deg); }
        .icon-tasks { background: linear-gradient(135deg, #2f80ed 0%, #0071e3 100%); }
        .icon-money { background: linear-gradient(135deg, #ff9500 0%, #ff5e3a 100%); }
        .icon-progress { background: linear-gradient(135deg, #b5179e 0%, #7209b7 100%); }
        .card-info h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 3px; color: #1d1d1f; }
        .card-info p { font-size: 13px; color: #86868b; font-weight: 400; }
        .card-arrow { color: #c7c7cc; font-size: 22px; font-weight: 300; transition: all 0.3s ease; padding-right: 4px; }
        .menu-card:hover .card-arrow { transform: translateX(5px); color: #1d1d1f; }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="header-title">¿Qué quieres ver ahora?</div>
</div>

<div class="main-content">
    <div class="menu-grid">
        <a href="Agenda.html" class="menu-card">
            <div class="card-left">
                <div class="card-icon icon-tasks">📝</div>
                <div class="card-info">
                    <h2>Tareas pendientes</h2>
                    <p>Organiza tus deberes y pendientes</p>
                </div>
            </div>
            <div class="card-arrow">›</div>
        </a>

        <a href="Dinero.html" class="menu-card">
            <div class="card-left">
                <div class="card-icon icon-money">💲</div>
                <div class="card-info">
                    <h2>Tu dinero</h2>
                    <p>Controla tus ingresos y gastos</p>
                </div>
            </div>
            <div class="card-arrow">›</div>
        </a>
        <a href="Rutina.html" class="menu-card">
            <div class="card-left">
                <div class="card-icon icon-tasks">🏋️</div>
                <div class="card-info">
                    <h2>Rutina</h2>
                    <p>Turtina de ejercicio</p>
                </div>
            </div>
            <div class="card-arrow">›</div>
        </a>
    </div>
</div>

<!-- Script para registrar el Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            // Se agregó ../ para salir de la carpeta Agenda
            navigator.serviceWorker.register('../sw.js')
                .then(reg => console.log('Service Worker registrado con éxito', reg))
                .catch(err => console.log('Error al registrar el Service Worker', err));
        });
    }
</script>

</body>
</html>
